[package]
name = "codex-cu-mcp"
version = "0.1.0"
edition = "2024"
description = "Standalone MCP server for macOS Computer Use, extracted from Codex++"
authors = ["Codex Team"]
license = "MIT OR Apache-2.0"

[dependencies]
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[[bin]]
name = "codex-cu-mcp"
path = "src/main.rs"
